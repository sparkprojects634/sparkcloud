<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="A brand entity connected to AI engines in a knowledge graph">
  <defs>
    <radialGradient id="geoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0079ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0079ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="geoCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0079ff" />
      <stop offset="100%" stop-color="#66b4ff" />
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="484" height="324" rx="26" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="260" cy="180" r="150" fill="url(#geoGlow)" />

  <!-- orbits -->
  <circle cx="260" cy="180" r="72" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="4 7" />
  <circle cx="260" cy="180" r="124" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="4 7" />

  <!-- edges -->
  <g stroke="#0079ff" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M260 180L146 96" />
    <path d="M260 180L392 108" />
    <path d="M260 180L128 236" />
    <path d="M260 180L398 254" />
    <path d="M260 180L258 300" />
  </g>

  <!-- satellite nodes -->
  <g>
    <circle cx="146" cy="96" r="24" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" />
    <rect x="134" y="92" width="24" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.4" />

    <circle cx="392" cy="108" r="24" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" />
    <rect x="380" y="104" width="24" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.4" />

    <circle cx="128" cy="236" r="22" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" />
    <rect x="117" y="232" width="22" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3" />

    <circle cx="398" cy="254" r="22" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" />
    <rect x="387" y="250" width="22" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3" />

    <circle cx="258" cy="300" r="20" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" />
    <rect x="248" y="296" width="20" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3" />
  </g>

  <!-- core brand entity -->
  <circle cx="260" cy="180" r="46" fill="url(#geoCore)" />
  <circle cx="260" cy="180" r="46" stroke="#ffffff" stroke-opacity="0.35" />
  <path d="M260 158l5.8 14.9L281 179l-15.2 6.1L260 200l-5.8-14.9L239 179l15.2-6.1L260 158z" fill="#ffffff" />

  <!-- pulse ring -->
  <circle cx="260" cy="180" r="60" stroke="#0079ff" stroke-opacity="0.4" stroke-width="1.5" />
</svg>
